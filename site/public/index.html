<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry</title>
    <!--
      Starlight maps every locale under a prefix, including the default one, so no
      page is generated at the site root. Without this file the repository homepage
      URL returns 404. The base path is part of every internal link on a project
      Pages site: /foundry/en/, never /en/.
    -->
    <meta http-equiv="refresh" content="0; url=/foundry/en/" />
    <link rel="canonical" href="https://fedcal.github.io/foundry/en/" />
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        background: #fff;
        color: #1b1b1f;
      }
      a { color: #2f5bea; }
      @media (prefers-color-scheme: dark) {
        body { background: #17181c; color: #f6f6f7; }
        a { color: #8aa9ff; }
      }
    </style>
  </head>
  <body>
    <h1>Foundry</h1>
    <p>Redirecting to the documentation&hellip;</p>
    <p>
      <a href="/foundry/en/">English</a> &middot;
      <a href="/foundry/it/">Italiano</a>
    </p>
  </body>
</html>
