version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned by SHA; Dependabot updates the SHA and the version comment together.
