name: Validate

# Every asset in this repository must satisfy AUTHORING.md before it is published.
# Actions are pinned by commit SHA: a moving tag is a supply-chain hole.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Assets conform to AUTHORING.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate plugin manifests, agents, skills, hooks and workflows
        run: node scripts/validate-assets.mjs
      - name: Unit tests for every plugin, with a coverage floor
        # The thresholds fail the run, so coverage cannot regress unnoticed — which is how it
        # got low enough to need a four-wave repair. They sit about a point under what the
        # suite currently measures (96.75 line / 83.04 branch / 95.10 funcs): enough headroom
        # for the ~0.07 run-to-run variance observed in lib/foundry.mjs, not enough to hide a
        # real loss. Raise them when the suite clears the next point; never lower them to make
        # a red build green.
        run: >
          node --test --experimental-test-coverage
          --test-coverage-lines=96
          --test-coverage-branches=82
          --test-coverage-functions=94
          'plugins/*/test/*.test.mjs'
      - name: Syntax check every executable asset
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find plugins scripts -name '*.mjs' -o -name '*.js' | sort)
          exit $fail

  manifests:
    name: Manifests satisfy the platform validator
    runs-on: ubuntu-latest
    # scripts/validate-assets.mjs enforces AUTHORING.md; it does not enforce the
    # platform's own manifest schema. Without this job a manifest can be rejected
    # by `/plugin install` while every local gate stays green. `plugin validate`
    # reads local files only — verified to run with no credentials and no network
    # account, so no secret is needed here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        # Pinned: an exact npm version is immutable, so this cannot change under us.
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict
      - name: Validate every plugin manifest
        run: |
          set -euo pipefail
          fail=0
          for dir in plugins/*/; do
            echo "--- ${dir}"
            claude plugin validate "$dir" --strict || fail=1
          done
          exit $fail

  contracts:
    name: Contract schemas are self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Every schema parses and declares its identity
        run: |
          set -euo pipefail
          for f in plugins/foundry-core/schemas/*.schema.json; do
            node -e "
              const s = require('./$f');
              const id = '$(basename "$f" .schema.json)';
              if (!s.\$id?.endsWith(id + '.schema.json')) { console.error('$f: \$id does not match filename'); process.exit(1); }
              if (s.properties?.schema?.const !== id) { console.error('$f: properties.schema.const must be ' + id); process.exit(1); }
              if (s.additionalProperties !== false) { console.error('$f: contracts must set additionalProperties:false'); process.exit(1); }
            "
          done
          echo "all contract schemas consistent"

  site:
    name: Documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files with the same rules the write gate uses
        run: |
          set -euo pipefail
          patterns='AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|sk-ant-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          # Vendor-published documentation examples are filtered out by value, not by excluding
          # whole files: excluding a file would create a place where a real secret could hide.
          examples='AKIAIOSFODNN7EXAMPLE|AKIAI44QH8DHBEXAMPLE|wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          # No file is excluded: an excluded file is a permanent place for a real
          # secret to hide. The value filter below covers the vendor doc examples.
          if git grep -nIE "$patterns" -- . | grep -vE "$examples"; then
            echo "::error::potential credential found in tracked files"
            exit 1
          fi
          echo "no credentials found"
